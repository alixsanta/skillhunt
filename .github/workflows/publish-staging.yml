name: SkillHunt - Publication images staging (SH-30)

# SH-30 — Mise en production V1.0 : construit les 4 images applicatives et les publie
# sur GitHub Container Registry pour que la VM de staging n'ait qu'à les "pull". Déclenchement
# manuel (pas encore automatisé sur push develop/main : périmètre restreint ce soir).
#
# vite_api_url est CUIT dans le bundle frontend au build (contrainte Vite, cf.
# frontend-web/Dockerfile) : à renseigner avec l'IP publique (ou domaine) de la cible
# de déploiement AVANT de lancer ce workflow.
on:
  workflow_dispatch:
    inputs:
      vite_api_url:
        description: "URL publique de l'API pour le build frontend (ex. http://129.146.1.2)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & push (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend-core
            context: ./backend-core
          - service: matching-service
            context: ./matching-service
          - service: gateway
            context: ./gateway
          - service: frontend-web
            context: ./frontend-web
            build_args: VITE_API_URL=${{ github.event.inputs.vite_api_url }}

    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4

      - name: 🔑 Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build & push de l'image ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: ${{ matrix.build_args || '' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/skillhunt/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/skillhunt/${{ matrix.service }}:${{ github.sha }}
