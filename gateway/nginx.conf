# SH-5 — API Gateway SkillHunt (point d'entrée unique, archi §2).
# Rate-limiting par IP (mitigation R7/R9) : l'authentification est la cible privilégiée
# du brute-force réseau — fenêtre stricte dédiée, distincte du filet général de l'API.

# 30 req/min : large pour un humain (login + refresh silencieux à chaque navigation),
# inopérant pour un brute-force (10^6 combinaisons TOTP, dictionnaires de mots de passe).
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;
# Filet général anti-abus, calibré pour ne jamais gêner l'UI (grille, recherche, refetchs).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=300r/m;
limit_req_status 429;

upstream backend_core {
    server backend-core:3001;
}

upstream frontend_web {
    server frontend-web:80;
}

server {
    listen 80;
    server_name _;

    # En-têtes de proxy : le backend voit l'IP réelle et l'origine d'entrée
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Authentification : fenêtre stricte (une rafale de 10 absorbe un chargement de page
    # avec refresh + login enchaînés ; au-delà => 429 SANS atteindre le backend).
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://backend_core;
    }

    # Reste de l'API (Swagger /api/docs compris) : relayé au monolithe.
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://backend_core;
    }

    # Tout le reste : la SPA (nginx du frontend gère le fallback /index.html).
    location / {
        proxy_pass http://frontend_web;
    }
}
