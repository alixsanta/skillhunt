# Infrastructure de développement local — SkillHunt
# PostgreSQL + PostGIS (SH-6) + LocalStack/S3 (SH-31) + Redis (SH-14).
# MongoDB et les services applicatifs seront ajoutés lors de la dockerisation complète (SH-2).
#
# Démarrer :  docker compose up -d
# Les identifiants sont volontairement ceux de DEV (à surcharger par .env en staging/prod).

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: skillhunt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-skillhunt}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-skillhunt}
      POSTGRES_DB: ${DB_NAME:-skillhunt}
    ports:
      # Port HÔTE 5433 par défaut pour éviter un conflit avec un PostgreSQL déjà installé sur 5432.
      # (Le port INTERNE du conteneur reste 5432.)
      - "${DB_PORT:-5433}:5432"
    volumes:
      - skillhunt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-skillhunt} -d ${DB_NAME:-skillhunt}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Stockage objet S3 émulé en local (SH-31) — aucun compte AWS requis en dev/test.
  # Permet de développer/tester l'upload de certifications (SH-10) et médias (SH-17)
  # sans coût cloud, et de garder la CI hermétique.
  localstack:
    image: localstack/localstack:3
    container_name: skillhunt-localstack
    restart: unless-stopped
    environment:
      # On n'active que S3 : surface minimale, démarrage rapide.
      SERVICES: s3
      # Identifiants de DEV factices (LocalStack ignore leur valeur réelle).
      AWS_DEFAULT_REGION: ${AWS_REGION:-eu-west-3}
    ports:
      # Edge port unique de LocalStack (toutes les API S3 passent par 4566).
      - "${AWS_S3_PORT:-4566}:4566"
    volumes:
      - skillhunt_localstack:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3 ls || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: skillhunt-redis
    restart: unless-stopped
    ports:
      # Port HÔTE 6380 par défaut : 6379 est occupé par un Redis personnel hors projet
      # sur le poste de dev, et backend-core/.env pointe déjà sur redis://localhost:6380.
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - skillhunt_redis:/data

  # MongoDB (SH-24) — persistance du chat (brique NoSQL de l'archi §2/§3).
  mongo:
    image: mongo:7
    container_name: skillhunt-mongo
    restart: unless-stopped
    ports:
      # Port HÔTE 27018 : 27017 est occupé par un service personnel hors projet
      # sur le poste de dev (même convention que Redis 6380).
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - skillhunt_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # Services applicatifs (SH-2) — profil "app" : `docker compose --profile app up -d --build`.
  # Sans profil, seule l'INFRA démarre (workflow dev inchangé : npm run start:dev, uvicorn).
  # Environnements (12-factor) : mêmes images, seule la config (env vars) change —
  # les valeurs ci-dessous sont celles de DEV, à surcharger en staging/prod.
  # ------------------------------------------------------------------

  backend-core:
    build: ./backend-core
    container_name: skillhunt-backend
    profiles: ["app"]
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: production
      # Réseau Docker interne : noms de services, ports INTERNES (5432/6379)
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-skillhunt}
      DB_PASSWORD: ${DB_PASSWORD:-skillhunt}
      DB_NAME: ${DB_NAME:-skillhunt}
      REDIS_URL: redis://redis:6379
      MONGODB_URL: mongodb://mongo:27017/skillhunt
      MATCHING_SERVICE_URL: http://matching-service:8000
      # Derrière la gateway (SH-5), front et API partagent l'origine 8088 : CORS devient
      # une défense en profondeur. 5173 reste listée pour le dev Vite hors conteneur.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8088,http://localhost:5173}
      AWS_REGION: ${AWS_REGION:-eu-west-3}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-skillhunt-media}
      AWS_S3_ENDPOINT: http://localstack:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      # Schéma versionné par migrations : appliquées au boot en dev/staging (cf. entrypoint)
      RUN_MIGRATIONS: "true"
      # JWT_PRIVATE_KEY/JWT_PUBLIC_KEY : absents en dev => paire éphémère (warning au boot).
      # En staging/prod : injectés par le gestionnaire de secrets, JAMAIS commités (§8).
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
    # AUCUN port hôte (SH-5) : la gateway est le point d'entrée unique (archi §2).
    # Swagger et gen:api restent accessibles via http://localhost:8088/api/docs.
    # Le dev direct (npm run start:dev sur 3001) est inchangé hors conteneur.
    # SH-29 — sonde de vivacité du monolithe (absente jusqu'ici : son état de santé
    # n'était pas mesurable). Cible EXPLICITEMENT 127.0.0.1 et non `localhost` : c'est
    # la résolution de `localhost` en IPv6 `::1` qui rend `frontend-web` et `gateway`
    # « unhealthy » en production depuis SH-30 (anomalie ouverte, cf. CHANGELOG §1.0.0).
    # On interroge /health (vivacité) et non /health/ready : une dépendance tombée ne
    # doit pas faire redémarrer en boucle un monolithe sain.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "require(''node:http'').get({host:''127.0.0.1'',port:3001,path:''/api/v1/health''},r=>process.exit(r.statusCode===200?0:1)).on(''error'',()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      localstack:
        condition: service_healthy

  matching-service:
    build: ./matching-service
    container_name: skillhunt-matching
    profiles: ["app"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USERNAME:-skillhunt}:${DB_PASSWORD:-skillhunt}@postgres:5432/${DB_NAME:-skillhunt}
      REDIS_URL: redis://redis:6379/0
      BACKEND_CORE_URL: http://backend-core:3001
    # AUCUN port hôte (archi §2) : service interne, seul le proxy backend-core (SH-22)
    # l'atteint via le réseau Docker privé — le navigateur ne peut pas le contourner.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend-web:
    build:
      context: ./frontend-web
      args:
        # Cuite dans le bundle au build (contrainte Vite) : l'URL vue DEPUIS LE NAVIGATEUR.
        # Même origine que la gateway (SH-5) => l'app tourne en same-origin.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8088}
    container_name: skillhunt-frontend
    profiles: ["app"]
    restart: unless-stopped
    # AUCUN port hôte (SH-5) : servi exclusivement à travers la gateway.
    depends_on:
      - backend-core

  gateway:
    build: ./gateway
    container_name: skillhunt-gateway
    profiles: ["app"]
    restart: unless-stopped
    # SEUL port publié du profil app (SH-5) : point d'entrée unique, rate-limiting
    # par IP sur /api/v1/auth (mitigation R7/R9). TLS : SH-4 (hardening).
    ports:
      - "${GATEWAY_PORT:-8088}:80"
    depends_on:
      - backend-core
      - frontend-web

  # ══════════════════════════════════════════════════════════════════════════════════
  # SH-29 — Profil `obs` : stack de supervision (C4.1.2)
  #
  # Activable INDÉPENDAMMENT du profil applicatif :
  #   docker compose --profile app --profile obs up -d
  #
  # Séparer les profils n'est pas cosmétique : la stack ajoute 5 conteneurs à une VM
  # b2-7 (7 Go) qui en héberge déjà 8. Pouvoir lancer l'application sans la supervision
  # — et l'inverse — évite d'imposer ce coût au développement quotidien.
  #
  # Aucun de ces services ne publie de port hôte, à l'exception de Grafana et Mailpit,
  # qui sont des interfaces destinées à un humain. Prometheus, Loki, Alloy et cAdvisor
  # restent strictement sur le réseau Docker privé.
  # ══════════════════════════════════════════════════════════════════════════════════

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: skillhunt-prometheus
    profiles: ["obs"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Rétention alignée sur Loki (7 jours) : borne l'usage disque sur une VM de démo.
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - skillhunt_prometheus:/prometheus
    mem_limit: 512m
    healthcheck:
      # 127.0.0.1 explicite : `localhost` se résout d'abord en IPv6 `::1`, cause de
      # l'anomalie « unhealthy » de SH-30 sur frontend-web et gateway.
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9090/-/healthy || exit 1']
      interval: 20s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.4.2
    container_name: skillhunt-loki
    profiles: ["obs"]
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - skillhunt_loki:/loki
    mem_limit: 512m
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3100/ready || exit 1']
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  alloy:
    image: grafana/alloy:v1.7.1
    container_name: skillhunt-alloy
    profiles: ["obs"]
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Socket Docker en LECTURE SEULE (CLAUDE.md §8) : Alloy n'a besoin que de LIRE la
      # liste des conteneurs et leurs flux. Un montage en écriture équivaudrait à donner
      # le contrôle du démon Docker — donc de l'hôte — au collecteur de logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - skillhunt_alloy:/var/lib/alloy/data
    mem_limit: 256m
    depends_on:
      loki:
        condition: service_healthy

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: skillhunt-cadvisor
    profiles: ["obs"]
    restart: unless-stopped
    # Métriques CPU/mémoire/redémarrages de TOUS les conteneurs, sans une ligne de code
    # applicatif : couvre postgres, redis, mongo, localstack, gateway et frontend-web,
    # qu'aucune instrumentation métier n'atteindrait (sondes S4 et S5).
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    mem_limit: 256m

  mailpit:
    image: axllent/mailpit:v1.22.3
    container_name: skillhunt-mailpit
    profiles: ["obs"]
    restart: unless-stopped
    # Capte les mails d'alerte RÉELLEMENT émis en SMTP par Grafana (chantier C).
    # Décision tracée (ticket §2) : préférable à un relais SMTP réel, qui imposerait un
    # secret dans le dépôt et rendrait la démonstration dépendante d'une boîte externe.
    # Le passage en production ne change qu'une variable d'environnement.
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    mem_limit: 128m

  grafana:
    image: grafana/grafana:11.5.2
    container_name: skillhunt-grafana
    profiles: ["obs"]
    restart: unless-stopped
    environment:
      # Identifiants par variables d'env, JAMAIS en dur (CLAUDE.md §8-4).
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Aucune inscription ni accès anonyme : la supervision expose l'état interne de la
      # plateforme et le contenu des logs.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Alerting par mail (chantier C) — Mailpit en dev/staging, relais réel en prod.
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${SMTP_HOST:-mailpit:1025}
      GF_SMTP_FROM_ADDRESS: ${SMTP_FROM:-alertes@skillhunt.local}
      GF_SMTP_FROM_NAME: SkillHunt Supervision
      GF_SMTP_SKIP_VERIFY: "true"
      # Destinataire des alertes. Le défaut est porté ICI et non dans le fichier de
      # provisioning : Grafana n'y comprend pas la syntaxe `${VAR:-defaut}` et rejetterait
      # tout le fichier si la variable n'était pas résolue.
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-exploitation@skillhunt.local}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - skillhunt_grafana:/var/lib/grafana
    ports:
      # Port hôte 3030 et NON 3000, le port par défaut de Grafana : 3000 est l'un des
      # ports les plus disputés d'un poste de développement (serveurs Node, Grafana
      # installé nativement…). Même précaution que pour Redis, exposé sur 6380 plutôt
      # que 6379. Le port INTERNE reste 3000 : seule la projection change.
      - "${GRAFANA_PORT:-3030}:3000"
    mem_limit: 512m
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy

volumes:
  skillhunt_pgdata:
  skillhunt_localstack:
  skillhunt_redis:
  skillhunt_mongo:
  # SH-29 — profil `obs`
  skillhunt_prometheus:
  skillhunt_loki:
  skillhunt_alloy:
  skillhunt_grafana:
