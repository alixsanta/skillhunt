# SH-30 — Stack de staging (VM unique, images pré-construites via GHCR).
# Les secrets viennent de .env.staging ; ce fichier compose fait aussi de l'interpolation
# ${VAR} pour ne pas dupliquer les identifiants Postgres/Mongo entre les services.
# ⚠️ Lancer avec --env-file explicite (sinon Compose ne lit QUE le fichier nommé ".env") :
#
#   docker compose --env-file .env.staging -f docker-compose.staging.yml pull
#   docker compose --env-file .env.staging -f docker-compose.staging.yml up -d
#
# Pas de domaine/TLS ce soir (démo jury sur IP publique nue) : gateway en HTTP:80 seul.
name: skillhunt-staging

networks:
  skillhunt-private-net:
    driver: bridge

volumes:
  skillhunt_pgdata:
  skillhunt_redis:
  skillhunt_mongo:
  skillhunt_localstack:
  # SH-29 — profil obs
  skillhunt_prometheus:
  skillhunt_loki:
  skillhunt_alloy:
  skillhunt_grafana:

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: skillhunt-postgres-staging
    restart: unless-stopped
    env_file: .env.staging
    networks:
      - skillhunt-private-net
    volumes:
      - skillhunt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: skillhunt-redis-staging
    restart: unless-stopped
    networks:
      - skillhunt-private-net
    volumes:
      - skillhunt_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mongo:
    image: mongo:7
    container_name: skillhunt-mongo-staging
    restart: unless-stopped
    env_file: .env.staging
    networks:
      - skillhunt-private-net
    volumes:
      - skillhunt_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Stockage S3 émulé (SH-31) : évite un vrai compte AWS pour la démo, zéro coût,
  # aucun changement de code côté backend-core (bascule uniquement par AWS_S3_ENDPOINT).
  localstack:
    image: localstack/localstack:3
    container_name: skillhunt-localstack-staging
    restart: unless-stopped
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: eu-west-3
      # Lu par le script d'init : dev et staging n'utilisent pas le même bucket.
      AWS_S3_BUCKET: skillhunt-staging
      MEDIA_CORS_ORIGINS: ${CORS_ORIGIN:-http://localhost:8088,http://localhost:5173}
    networks:
      - skillhunt-private-net
    volumes:
      - skillhunt_localstack:/var/lib/localstack
      # SH-16a — bucket + chiffrement par défaut + CORS, créés au démarrage.
      - ./localstack/init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3 ls || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend-core:
    image: ghcr.io/alixsanta/skillhunt/backend-core:latest
    container_name: skillhunt-backend-staging
    restart: unless-stopped
    env_file: .env.staging
    environment:
      NODE_ENV: production
      # Migrations TypeORM appliquées au boot (docker-entrypoint.sh, SH-2) — pas d'étape
      # de déploiement séparée ce soir.
      RUN_MIGRATIONS: "true"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/${MONGO_INITDB_DATABASE}?authSource=admin
      MATCHING_SERVICE_URL: http://matching-service:8000
      AWS_S3_ENDPOINT: http://localstack:4566
      AWS_S3_BUCKET: skillhunt-staging
      # Endpoint vu DEPUIS LE NAVIGATEUR : la signature SigV4 couvre l'hôte (D9). Pas de
      # valeur par défaut en staging — l'endpoint doit être choisi explicitement.
      AWS_S3_PUBLIC_ENDPOINT: ${AWS_S3_PUBLIC_ENDPOINT}
      MEDIA_MAX_FILE_MB: ${MEDIA_MAX_FILE_MB:-500}
      MEDIA_MAX_PER_FREELANCE: ${MEDIA_MAX_PER_FREELANCE:-20}
      MEDIA_SIGNED_URL_TTL: ${MEDIA_SIGNED_URL_TTL:-900}
      MEDIA_DRAFT_TTL_HOURS: ${MEDIA_DRAFT_TTL_HOURS:-24}
      AWS_REGION: eu-west-3
    networks:
      - skillhunt-private-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      localstack:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  matching-service:
    image: ghcr.io/alixsanta/skillhunt/matching-service:latest
    container_name: skillhunt-matching-staging
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      BACKEND_CORE_URL: http://backend-core:3001
    networks:
      - skillhunt-private-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  media-service:
    image: ghcr.io/alixsanta/skillhunt/media-service:latest
    restart: unless-stopped
    environment:
      PORT: 3002
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      MEDIA_WORKER_CONCURRENCY: ${MEDIA_WORKER_CONCURRENCY:-1}
      MEDIA_TMP_DIR: /tmp/media
    networks:
      - skillhunt-private-net
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # VITE_API_URL est CUIT dans le bundle au build (Vite) : rien à passer au runtime ici,
  # l'image doit avoir été construite avec le bon --build-arg (cf. workflow CI).
  frontend-web:
    image: ghcr.io/alixsanta/skillhunt/frontend-web:latest
    container_name: skillhunt-frontend-staging
    restart: unless-stopped
    networks:
      - skillhunt-private-net
    depends_on:
      - backend-core
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  gateway:
    image: ghcr.io/alixsanta/skillhunt/gateway:latest
    container_name: skillhunt-gateway-staging
    restart: unless-stopped
    networks:
      - skillhunt-private-net
    ports:
      # Seul port publié (archi §2) — pas de domaine/certificat TLS pour la démo de ce soir.
      - "80:80"
    depends_on:
      - backend-core
      - frontend-web
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ══════════════════════════════════════════════════════════════════════════════════
  # SH-29 — Profil `obs` : supervision en PRODUCTION (C4.1.2)
  #
  #   docker compose --env-file .env.staging -f docker-compose.staging.yml --profile obs up -d
  #
  # ⚠️ PRÉREQUIS — copier le dossier `observability/` sur la VM, à côté du compose :
  #
  #   scp -r observability ubuntu@<IP_VM>:~/
  #
  # Contrairement aux services applicatifs, qui tirent des images pré-construites depuis
  # GHCR, ces conteneurs montent leurs fichiers de configuration depuis le disque. Sans ce
  # dossier, Docker créerait des répertoires vides à la place des fichiers attendus, et
  # Prometheus, Loki, Alloy et Grafana démarreraient sans configuration.
  #
  # Ce choix garde une SOURCE DE VÉRITÉ UNIQUE pour les sondes, seuils et tableaux de bord :
  # les mêmes fichiers servent en développement et en production. Les embarquer dans des
  # images dédiées supprimerait cette étape de copie, au prix d'une divergence possible
  # entre les deux environnements — et d'un cycle de publication à chaque seuil ajusté.
  #
  # ── Trois différences assumées avec le profil `obs` de développement ────────────────
  #
  # 1. AUCUN service n'est exposé publiquement. Grafana et Mailpit sont liés à 127.0.0.1 :
  #    ils ne sont atteignables QUE par tunnel SSH.
  #
  #      ssh -L 3030:127.0.0.1:3030 -L 8025:127.0.0.1:8025 ubuntu@<IP_VM>
  #
  #    En développement, ces deux interfaces sont publiées sur l'hôte. Ici la VM n'a ni TLS
  #    ni durcissement (SH-4 non fait) : exposer Grafana en HTTP nu sur une IP publique
  #    donnerait accès à l'état interne de la plateforme ET au contenu des logs. Le tunnel
  #    supprime cette surface sans rien coûter à l'exploitation.
  #
  # 2. Budget mémoire plafonné. La VM est une b2-7 (7 Go) hébergeant déjà 8 conteneurs ;
  #    ces 6 services ajoutent ~1,8 Go bornés. Pour une phase d'observation prolongée,
  #    passer en b2-15 plutôt que de rogner les limites — un conteneur de supervision tué
  #    par l'OOM, c'est une supervision aveugle au pire moment.
  #
  # 3. Rétention à 7 jours, identique au développement : suffisant pour la fenêtre
  #    d'observation, et borné sur le disque d'une VM de démonstration.
  # ══════════════════════════════════════════════════════════════════════════════════

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: skillhunt-prometheus-staging
    profiles: ["obs"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    networks:
      - skillhunt-private-net
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - skillhunt_prometheus:/prometheus
    mem_limit: 512m
    healthcheck:
      # 127.0.0.1 et non `localhost` : c'est cette résolution en IPv6 qui a produit AN-01.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  loki:
    image: grafana/loki:3.4.2
    container_name: skillhunt-loki-staging
    profiles: ["obs"]
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - skillhunt-private-net
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - skillhunt_loki:/loki
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  alloy:
    image: grafana/alloy:v1.7.1
    container_name: skillhunt-alloy-staging
    profiles: ["obs"]
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    networks:
      - skillhunt-private-net
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Socket Docker en LECTURE SEULE : en écriture, il donnerait le contrôle du démon —
      # donc de la VM entière — au collecteur de logs (CLAUDE.md §8).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - skillhunt_alloy:/var/lib/alloy/data
    mem_limit: 256m
    depends_on:
      loki:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: skillhunt-cadvisor-staging
    profiles: ["obs"]
    restart: unless-stopped
    # ⚠️ `privileged` et montages système : mode de fonctionnement normal de cAdvisor, mais
    # surface d'hôte élevée sur une VM sans durcissement. Assumé et documenté dans
    # SUPERVISION.md §8 — c'est le prix des sondes S4 et S5, qui couvrent les 6 conteneurs
    # sans instrumentation applicative possible (bases, gateway, frontend).
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - skillhunt-private-net
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      # SH-50 — Socket Docker monté EXPLICITEMENT, en plus de /var/run.
      #
      # Sans lui, cAdvisor ne résout pas les métadonnées Docker : il publie les cgroups de
      # l'HÔTE (`id="/"`, `id="/system.slice"`) sans le label `name`, et les sondes S4 et S5
      # — qui filtrent sur `name=~"skillhunt-.*"` — restent vides. Constaté sur la VM le
      # 2026-08-19 : 44 séries exposées, AUCUNE portant un nom de conteneur.
      #
      # Le montage de /var/run suffisait sous Docker Desktop mais pas sur l'Ubuntu de la
      # VM — troisième divergence développement/production de ce ticket, après l'anomalie
      # IPv6 (AN-01) et le journal d'accès d'uvicorn.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      # SH-50 — Doublon VOLONTAIRE sous /rootfs. cAdvisor cherche les métadonnées de
      # couches via ce préfixe (`/rootfs/var/lib/docker/image/overlay2/layerdb/...`), or un
      # bind-mount de `/` ne propage PAS les points de montage imbriqués : /var/lib/docker
      # n'apparaissait pas sous /rootfs. Résultat, cAdvisor énumérait bien les conteneurs
      # puis échouait sur chacun — « failed to identify the read-write layer ID ».
      - /var/lib/docker/:/rootfs/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    # `--docker_only` : n'expose QUE les conteneurs, pas les cgroups système de l'hôte.
    # Réduit le bruit et divise par ~3 le nombre de séries, ce qui compte sur une b2-7.
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
    mem_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mailpit:
    image: axllent/mailpit:v1.22.3
    container_name: skillhunt-mailpit-staging
    profiles: ["obs"]
    restart: unless-stopped
    networks:
      - skillhunt-private-net
    ports:
      # Lié à 127.0.0.1 : accessible uniquement par tunnel SSH (cf. en-tête du profil).
      - "127.0.0.1:8025:8025"
    mem_limit: 128m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.5.2
    container_name: skillhunt-grafana-staging
    profiles: ["obs"]
    restart: unless-stopped
    environment:
      # Identifiants depuis .env.staging, JAMAIS en dur (CLAUDE.md §8-4).
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Servi derrière un tunnel SSH : Grafana doit connaître son URL racine.
      GF_SERVER_ROOT_URL: http://127.0.0.1:3030/
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${SMTP_HOST:-mailpit:1025}
      GF_SMTP_FROM_ADDRESS: ${SMTP_FROM:-alertes@skillhunt.local}
      GF_SMTP_FROM_NAME: SkillHunt Supervision
      GF_SMTP_SKIP_VERIFY: "true"
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-exploitation@skillhunt.local}
    networks:
      - skillhunt-private-net
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - skillhunt_grafana:/var/lib/grafana
    ports:
      # Lié à 127.0.0.1 : la supervision expose l'état interne de la plateforme et le
      # contenu des logs. Sans TLS ni durcissement (SH-4), le tunnel SSH est la seule
      # exposition acceptable sur une IP publique.
      - "127.0.0.1:3030:3000"
    mem_limit: 512m
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
