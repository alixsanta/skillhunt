# SH-2 — Serveur statique du frontend-web (SPA React).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fallback SPA : toute route inconnue du disque est rendue par index.html
    # (le routeur React prend le relais côté client).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les assets Vite sont fingerprintés : cache long et immuable (éco-conception, SH-28)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
